<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPN Server Script Generator</title>

<style>
*{
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at top left, rgba(56,189,248,.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(34,197,94,.12), transparent 35%),
        linear-gradient(135deg,#020617,#0f172a,#111827);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:35px 20px;
    overflow:auto;
}

.container{
    width:100%;
    max-width:680px;
    background:rgba(2,6,23,.90);
    border:1px solid #1e293b;
    border-radius:18px;
    padding:18px;
    box-shadow:0 0 35px rgba(0,0,0,.6);
    transform:scale(.78);
    transform-origin:center;
}

h1{
    text-align:center;
    color:#38bdf8;
    margin-bottom:3px;
    font-size:28px;
}

.subtitle{
    text-align:center;
    color:#94a3b8;
    margin-bottom:14px;
    font-size:14px;
}

.form-group{
    margin-bottom:12px;
}

label{
    font-size:13px;
    color:#cbd5e1;
}

input{
    width:100%;
    padding:12px;
    margin-top:6px;
    border-radius:10px;
    border:1px solid #334155;
    background:#0f172a;
    color:white;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#38bdf8;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#0284c7,#0ea5e9);
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

button:hover{
    opacity:.9;
}

.section-title{
    margin-top:16px;
    margin-bottom:6px;
    color:#38bdf8;
    font-weight:600;
    font-size:14px;
}

.top-title{
    margin-top:0;
}

textarea{
    width:100%;
    height:140px;
    background:#020617;
    color:#22c55e;
    border:1px solid #334155;
    border-radius:12px;
    padding:12px;
    font-family:Consolas, monospace;
    font-size:12.5px;
    resize:none;
}

.copy-btn{
    background:linear-gradient(135deg,#16a34a,#22c55e);
}

.link-box{
    margin-top:8px;
    margin-bottom:14px;
    border:1px solid #334155;
    border-radius:10px;
    overflow:hidden;
    font-size:14px;
}

.link-row{
    display:grid;
    grid-template-columns:1fr 100px 80px;
}

.link-left{
    background:#16a34a;
    padding:8px 12px;
    font-weight:600;
    color:white;
    cursor:pointer;
    text-decoration:underline;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.link-right{
    background:#020617;
    padding:8px 12px;
    text-align:center;
    font-weight:bold;
    color:white;
    border-left:1px solid #334155;
}

.copy-small{
    background:#0ea5e9;
    color:white;
    border:none;
    border-left:1px solid #334155;
    border-radius:0;
    padding:8px 10px;
    margin:0;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
}

.copy-small:hover{
    opacity:.9;
}

.note{
    text-align:center;
    color:#64748b;
    font-size:12px;
    margin-top:14px;
}

@media(max-width:600px){
    body{
        padding:20px;
        align-items:flex-start;
    }

    .container{
        transform:scale(1);
        max-width:100%;
    }

    .link-row{
        grid-template-columns:1fr 75px 65px;
        font-size:12px;
    }

    textarea{
        height:155px;
        font-size:12px;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>VPN Generator</h1>
    <div class="subtitle">Server Script + Client Script + Winbox Link</div>

    <div class="section-title top-title">WINBOX LINK</div>

    <div class="link-box">
        <div class="link-row">
            <div class="link-left" id="winboxLink" onclick="copyWinboxLink()">
                vpn.marvincloud2.link:00000
            </div>
            <div class="link-right" id="winboxPort">00000</div>
            <button class="copy-small" onclick="copyWinboxLink()">COPY</button>
        </div>
    </div>

    <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username">
    </div>

    <div class="form-group">
        <label>Remote Address</label>
        <input type="text" id="remoteAddress" value="16.66.1.0" placeholder="Example: 16.66.1.61">
    </div>

    <button onclick="generateScript()">Generate Script</button>

    <div class="section-title">SERVER SCRIPT</div>
    <textarea id="serverOutput" readonly placeholder="Server script will appear here..."></textarea>
    <button class="copy-btn" onclick="copyServerScript()">Copy Server Script</button>

    <div class="section-title">CLIENT SCRIPT</div>
    <textarea id="clientOutput" readonly placeholder="Client script will appear here..."></textarea>
    <button class="copy-btn" onclick="copyClientScript()">Copy Client Script</button>

    <div class="note">
        Password default: 1 | Service: SSTP | Profile: 1mbps | Winbox: 8291
    </div>
</div>

<script>
/* ==============================
   HIDDEN DEFAULT SETTINGS
   DITO MO LANG PALITAN DEFAULT
   ============================== */

const SERVER_PUBLIC_IP = "152.42.226.151";
const VPN_PROFILE      = "1mbps";
const VPN_SERVICE      = "sstp";
const VPN_PASSWORD     = "1";
const EXP_DATE         = "JUN 6, 2027";

/* CLIENT SIDE DEFAULT */
const SSTP_CONNECT_TO  = "vpn.marvincloud2.link";
const SSTP_NAME        = "vpn.marvincloud2.link";
const SSTP_PROFILE     = "default-encryption";

const BACKUP_USER      = "backup";
const BACKUP_PASSWORD  = "oOo";
const BACKUP_GROUP     = "full";

const ALLOW_INTERFACE  = "vpn_marvinconfiguration";

/* PORT FORWARD DEFAULT */
const WINBOX_TO_PORT   = "8291";

let CURRENT_WINBOX_LINK = "";

/* ==============================
   RANDOM PORT 1 TO 65535
   ============================== */

function getRandomPort(){
    return Math.floor(Math.random() * 65535) + 1;
}

/* ============================== */

function generateScript(){
    let username = document.getElementById("username").value.trim();
    let remoteAddress = document.getElementById("remoteAddress").value.trim();

    if(username === ""){
        alert("Please enter username.");
        return;
    }

    if(remoteAddress === ""){
        alert("Please enter remote address.");
        return;
    }

    let WINBOX_PORT = getRandomPort();

    let comment = `${username} | WINBOX: ${WINBOX_PORT} | EXP: ${EXP_DATE}`;

    let serverScript = `/ppp secret
add name="${username}" password="${VPN_PASSWORD}" profile=${VPN_PROFILE} service=${VPN_SERVICE} remote-address=${remoteAddress} comment="${comment}"

/ip firewall nat
add action=dst-nat chain=dstnat dst-address=${SERVER_PUBLIC_IP} dst-port=${WINBOX_PORT} protocol=tcp to-addresses=${remoteAddress} to-ports=${WINBOX_TO_PORT} comment="${comment}"`;

    let clientScript = `/interface sstp-client
add connect-to=${SSTP_CONNECT_TO} disabled=no name="${SSTP_NAME}" password=${VPN_PASSWORD} profile=${SSTP_PROFILE} user="${username}" comment="${comment}"

/user
add name=${BACKUP_USER} password="${BACKUP_PASSWORD}" group=${BACKUP_GROUP}

/ip firewall filter
add action=accept chain=input comment="ALLOW REMOTE VPN" in-interface="${ALLOW_INTERFACE}"
add action=accept chain=forward comment="ALLOW REMOTE VPN" in-interface="${ALLOW_INTERFACE}"`;

    document.getElementById("serverOutput").value = serverScript;
    document.getElementById("clientOutput").value = clientScript;

    CURRENT_WINBOX_LINK = `${SSTP_CONNECT_TO}:${WINBOX_PORT}`;

    document.getElementById("winboxLink").innerText = CURRENT_WINBOX_LINK;
    document.getElementById("winboxPort").innerText = WINBOX_PORT;
}

function copyText(text){
    navigator.clipboard.writeText(text).then(function(){
        alert("Copied!");
    }).catch(function(){
        alert("Copy failed. Please copy manually.");
    });
}

function copyWinboxLink(){
    if(CURRENT_WINBOX_LINK === ""){
        alert("Generate script first.");
        return;
    }

    copyText(CURRENT_WINBOX_LINK);
}

function copyServerScript(){
    let output = document.getElementById("serverOutput");

    if(output.value.trim() === ""){
        alert("Generate script first.");
        return;
    }

    copyText(output.value);
}

function copyClientScript(){
    let output = document.getElementById("clientOutput");

    if(output.value.trim() === ""){
        alert("Generate script first.");
        return;
    }

    copyText(output.value);
}
</script>

</body>
</html>
